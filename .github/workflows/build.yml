# 复制到 .github/workflows/build.yml 即可启用云编译。
# 推送 workflow 需要 token 带 workflow scope：
#   gh auth refresh -h github.com -s workflow
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential curl file \
            libgtk-3-dev libgtk-4-dev libpango1.0-dev libsoup-3.0-dev libglib2.0-dev \
            libfontconfig1-dev libcairo2-dev rpm patchelf python3 desktop-file-utils
      - name: Install HuxerUI SDK
        run: |
          curl -fsSL https://github.com/HuxerUI/HuxerUI/releases/latest/download/install.sh -o /tmp/hux.sh
          sh /tmp/hux.sh --yes
          echo "HUXERUI_HOME=$HOME/.local/share/HuxerUI" >> "$GITHUB_ENV"
          echo "$HOME/.local/share/HuxerUI/bin" >> "$GITHUB_PATH"
      - name: Build and package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          export VERSION
          huxerui build linux --config release
          ./scripts/stage.sh
          ./scripts/package-all.sh "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cursor-switcher-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
          fail_on_unmatched_files: true
